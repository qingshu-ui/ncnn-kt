name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_COMPILE_SDK: android-37.0
  ANDROID_BUILD_TOOLS: 37.0.0

jobs:
  windows:
    name: Windows x64 (JVM + mingwX64)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            build/ncnn-download
          key: ncnn-build-windows-${{ hashFiles('gradle/libs.versions.toml', 'buildSrc/src/main/kotlin/tasks/NcnnSdkPlugin.kt') }}
      - name: Test
        shell: pwsh
        run: ./gradlew.bat :ncnn-core:jvmTest :ncnn-jvm-jni:jvmTest :ncnn-core:mingwX64Test --stacktrace
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-test-reports
          path: |
            ncnn-core/build/reports
            ncnn-core/build/test-results
            ncnn-jvm-jni/build/reports
            ncnn-jvm-jni/build/test-results

  linux:
    name: Linux x64 (JVM + linuxX64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            build/ncnn-download
          key: ncnn-build-linux-${{ hashFiles('gradle/libs.versions.toml', 'buildSrc/src/main/kotlin/tasks/NcnnSdkPlugin.kt') }}
      - name: Test
        run: ./gradlew :ncnn-core:jvmTest :ncnn-core:linuxX64Test --stacktrace
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-test-reports
          path: |
            ncnn-core/build/reports
            ncnn-core/build/test-results

  android:
    name: Android (AAR)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKMANAGER" "platforms;$ANDROID_COMPILE_SDK" "build-tools;$ANDROID_BUILD_TOOLS"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            build/ncnn-download
          key: ncnn-build-android-${{ hashFiles('gradle/libs.versions.toml', 'buildSrc/src/main/kotlin/tasks/NcnnSdkPlugin.kt') }}
      - name: Build AAR
        run: ./gradlew :ncnn-android-jni:bundleAndroidMainAar :ncnn-core:assembleAndroidMain --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ncnn-android-jni-aar
          path: ncnn-android-jni/build/outputs/aar

  spotless:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKMANAGER" "platforms;$ANDROID_COMPILE_SDK" "build-tools;$ANDROID_BUILD_TOOLS"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check formatting
        run: ./gradlew spotlessCheck --stacktrace
