name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_COMPILE_SDK: android-37.0
  ANDROID_BUILD_TOOLS: 37.0.0
  ANDROID_NDK: 27.2.12479018

jobs:
  windows:
    name: Windows x64 (JVM + mingwX64)
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      NCNN_ANDROID: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install MinGW-w64, CMake and Ninja
        run: choco install mingw cmake ninja --no-progress -y
      - name: Configure MinGW path
        shell: pwsh
        run: |
          $gxx = Get-ChildItem 'C:\ProgramData\chocolatey\lib\mingw' -Recurse -Filter g++.exe |
            Select-Object -First 1
          "NCNN_MINGW_BIN=$($gxx.DirectoryName)" >> $env:GITHUB_ENV
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            ncnn/build/downloads
            ncnn/build/ncnn/prebuilt
          key: ncnn-windows-${{ hashFiles('gradle/libs.versions.toml', 'ncnn/build.gradle.kts', 'buildSrc/src/main/kotlin/NcnnBuilds.kt', 'buildSrc/src/main/kotlin/PreparePrebuiltInstallTask.kt') }}
      - name: Test
        shell: pwsh
        run: ./gradlew.bat :ncnn:jvmTest :ncnn:mingwX64Test :ncnn:jvmJar --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-reports
          path: |
            ncnn/build/reports
            ncnn/build/test-results

  linux-x64:
    name: Linux x64 (JVM + linuxX64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NCNN_ANDROID: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install native tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build build-essential
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            ncnn/build/downloads
            ncnn/build/ncnn/prebuilt
          key: ncnn-linux-x64-${{ hashFiles('gradle/libs.versions.toml', 'ncnn/build.gradle.kts', 'buildSrc/src/main/kotlin/NcnnBuilds.kt', 'buildSrc/src/main/kotlin/PreparePrebuiltInstallTask.kt') }}
      - name: Test
        run: ./gradlew :ncnn:jvmTest :ncnn:linuxX64Test --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-x64-test-reports
          path: |
            ncnn/build/reports
            ncnn/build/test-results

  macos-arm64:
    name: macOS arm64 (JVM + macos/ios)
    runs-on: macos-15
    timeout-minutes: 90
    env:
      NCNN_ANDROID: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            ncnn/build/downloads
            ncnn/build/ncnn/prebuilt
          key: ncnn-macos-arm64-${{ hashFiles('gradle/libs.versions.toml', 'ncnn/build.gradle.kts', 'buildSrc/src/main/kotlin/NcnnBuilds.kt', 'buildSrc/src/main/kotlin/PreparePrebuiltInstallTask.kt') }}
      - name: Test
        run: >-
          ./gradlew
          :ncnn:jvmTest
          :ncnn:macosArm64Test
          :ncnn:iosSimulatorArm64Test
          :ncnn:linkDebugTestIosArm64
          --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-test-reports
          path: |
            ncnn/build/reports
            ncnn/build/test-results

  android:
    name: Android (AAR)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK + NDK
        run: |
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKMANAGER" "platforms;$ANDROID_COMPILE_SDK" "build-tools;$ANDROID_BUILD_TOOLS" "ndk;$ANDROID_NDK"
      - name: Install native tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build build-essential
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: |
            ncnn/build/downloads
            ncnn/build/ncnn/prebuilt
          key: ncnn-android-${{ hashFiles('gradle/libs.versions.toml', 'ncnn/build.gradle.kts', 'buildSrc/src/main/kotlin/NcnnBuilds.kt', 'buildSrc/src/main/kotlin/PreparePrebuiltInstallTask.kt') }}
      - name: Build AAR (all ABIs)
        run: ./gradlew :ncnn-android-native:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: android-aar
          path: ncnn-android-native/build/outputs/aar

  spotless:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKMANAGER" "platforms;$ANDROID_COMPILE_SDK" "build-tools;$ANDROID_BUILD_TOOLS"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check formatting
        run: ./gradlew spotlessCheck --stacktrace
