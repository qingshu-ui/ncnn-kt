name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_COMPILE_SDK: android-37.0
  ANDROID_BUILD_TOOLS: 37.0.0

jobs:
  windows:
    name: Windows x64 (JVM + mingwX64)
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      NCNN_ANDROID: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            third_party/ncnn/.downloads
            third_party/ncnn/windows-x64
          key: ncnn-windows-${{ hashFiles('third_party/ncnn/README.md', 'third_party/ncnn/include/ncnn/c_api.h', 'scripts/fetch-ncnn-release.ps1') }}
      - name: Fetch ncnn SDK
        shell: pwsh
        run: ./scripts/fetch-ncnn-release.ps1 -Platform windows-x64
      - name: Test
        shell: pwsh
        run: ./gradlew.bat :ncnn-core:jvmTest :ncnn-core:mingwX64Test :ncnn-jni:jar --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-reports
          path: |
            ncnn-core/build/reports
            ncnn-core/build/test-results

  linux-x64:
    name: Linux x64 (JVM + linuxX64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NCNN_ANDROID: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            third_party/ncnn/.downloads
            third_party/ncnn/linux-x64
          key: ncnn-linux-x64-${{ hashFiles('third_party/ncnn/README.md', 'third_party/ncnn/include/ncnn/c_api.h', 'scripts/fetch-ncnn-release.sh') }}
      - name: Fetch ncnn SDK
        run: bash ./scripts/fetch-ncnn-release.sh --platform linux-x64
      - name: Test
        run: ./gradlew :ncnn-core:jvmTest :ncnn-core:linuxX64Test --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-x64-test-reports
          path: |
            ncnn-core/build/reports
            ncnn-core/build/test-results

  android:
    name: Android (AAR)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKMANAGER" "platforms;$ANDROID_COMPILE_SDK" "build-tools;$ANDROID_BUILD_TOOLS"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            third_party/ncnn/.downloads
            third_party/ncnn/linux-x64
            third_party/ncnn/android
          key: ncnn-android-${{ hashFiles('third_party/ncnn/README.md', 'third_party/ncnn/include/ncnn/c_api.h', 'scripts/fetch-ncnn-release.sh') }}
      - name: Fetch ncnn SDK
        run: bash ./scripts/fetch-ncnn-release.sh --platform linux-x64,android
      - name: Build AAR and test app
        run: ./gradlew :ncnn-android-native:assembleDebug :android-test-app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: android-aar
          path: ncnn-android-native/build/outputs/aar

  spotless:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKMANAGER" "platforms;$ANDROID_COMPILE_SDK" "build-tools;$ANDROID_BUILD_TOOLS"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check formatting
        run: ./gradlew spotlessCheck --stacktrace
